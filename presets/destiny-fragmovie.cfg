// ET: Legacy cinematic movie config — modified from Destiny (Israel)
// Bundled by ET: Legacy Frag Finder as an optional example preset.
// Resolution: 2560x1440 @ 360Hz — maximum visual quality for video rendering.

// Binds
bind N "exec cameras/cam1.cfg"
bind "/" "vstr toggle_hud"

set hud_movie     "cg_althud movie; set toggle_hud vstr hud_movie_hud"
set hud_movie_hud "cg_althud movie_hud; set toggle_hud vstr hud_movie"
set toggle_hud "vstr hud_movie_hud"

// Personal and identity
seta cg_altHud "movie"
seta cg_fov "90"

// Graphics and maximum quality
seta com_maxfps "500"
seta r_mode "-2"
seta r_customwidth "2560"
seta r_customheight "1440"
seta r_displayRefresh "360"
seta r_fullscreen "0"
seta r_ignorehwgamma "1"
seta r_gamma "1.3"
seta r_intensity "1.0"
seta r_overBrightBits "0"
seta r_mapOverBrightBits "0"
seta r_picmip "0"
seta r_ext_texture_filter_anisotropic "16"
seta r_textureAnisotropy "16"
seta r_textureMode "gl_linear_mipmap_linear"
seta r_subdivisions "1"
seta r_lodCurveError "10000"
seta r_lodbias "-2"
seta r_flares "1"
seta r_fastsky "0"
seta r_wolffog "1"
seta r_dynamiclight "1"
seta r_drawSun "1"
seta r_finish "1"
seta r_detailtextures "1"

// Visual effects
seta cg_wolfparticles "1"
seta cg_brassTime "50000"
seta cg_markTime "300000"
seta cg_gibs "1"
seta cg_showblood "1"
seta cg_bloodFlash "0"
seta cg_bloodPuff "1"
seta cg_bloodDamageBlend "0"
seta cg_muzzleFlash "1"
seta cg_tracers "1"
seta r_coronas "1"

// View model and motion
seta cg_drawGun "1"
seta cg_bobbing "0.002"
seta cg_bobyaw "0.002"
seta cg_bobroll "0.002"
seta cg_bobpitch "0.002"
seta cg_bobup "0.005"
seta cg_runroll "0.005"
seta cg_runpitch "0.005"

// Crosshair
seta cg_drawCrosshair "5"
seta cg_crosshairSize "24"
seta cg_crosshairColor "White"
seta cg_crosshairAlphaAlt "1"
seta cg_useCvarCrosshair "1"
seta cg_crosshairPulse "0"
seta cg_crosshairHealth "0"

// HUD and movie presentation
seta cg_drawFPS "0"
seta cg_drawSnapshot "0"
seta cg_lagometer "0"
seta cg_drawTeamOverlay "0"
seta cg_autoswitch "0"
seta cg_autoReload "0"
seta cl_lang "en"
seta s_volume "0.5"
seta s_musicvolume "0"

// HUD filtering
seta cg_drawFireteam "0"
seta cg_drawCompass "0"
seta cg_drawCompassIcons "0"
seta cg_drawIcons "0"
seta cg_drawStatus "0"
seta cg_drawNames "0"
seta cg_drawCrosshairNames "0"
seta cg_drawSpectatorNames "0"
seta cg_popupFilter "2"
seta cg_popupWaitTime "2500"
seta cg_drawReinforcementTime "0"
seta cg_fireteamSprites "0"

// Memory and system allocation
seta com_hunkMegs "1024"
seta com_zoneMegs "256"
seta com_soundMegs "256"

vid_restart
